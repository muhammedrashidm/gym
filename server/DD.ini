
enum Sex {
  MALE
  FEMALE
  OTHER
}

enum FitnessGoal {
  LOSE
  MAINTAIN
  GAIN
}

enum ExpLevel {
  BEGINNER
  INTERMEDIATE
  PRO
}

enum PlanType {
  MONTHLY
  ANNUAL
  CLASS
  PUNCH_CARD
}

enum MembershipStatus {
  PAID
  UNPAID
  ACTIVE_KINETIC
}

// ─────────────────────────────────────────
// IDENTITY & AUTH
// ─────────────────────────────────────────

model User {
  id            String         @id @default(uuid())
  phoneNumber   String         @unique
  isActive      Boolean        @default(true)
  createdAt     DateTime       @default(now())

  profile       Profile?
  userRoles     UserRole[]
  refreshTokens RefreshToken[]
  otpRequests   OtpRequest[]
}

model OtpRequest {
  id          String   @id @default(uuid())
  phoneNumber String
  code        String
  expiresAt   DateTime
  verified    Boolean  @default(false)
  createdAt   DateTime @default(now())

  userId String?
  user   User?   @relation(fields: [userId], references: [id])
}

model RefreshToken {
  id        String   @id @default(uuid())
  token     String   @unique
  userId    String
  user      User     @relation(fields: [userId], references: [id], onDelete: Cascade)
  expiresAt DateTime
  isRevoked Boolean  @default(false)
  createdAt DateTime @default(now())
}

// ─────────────────────────────────────────
// USER PROFILE  (Hybrid Bridge)
// ─────────────────────────────────────────

model Profile {
  id             String       @id @default(uuid())
  userId         String?      @unique
  user           User?        @relation(fields: [userId], references: [id])
  phoneNumber    String       @unique
  fullName       String
  age            Int?
  sex            Sex?
  fitnessGoal    FitnessGoal?
  expLevel       ExpLevel?
  isKinetic      Boolean      @default(false)
  isClaimed      Boolean      @default(false)
  createdById    String?
  createdAtGymId String?
  createdAt      DateTime     @default(now())

  memberships Membership[]
}

// ─────────────────────────────────────────
// GYM
// ─────────────────────────────────────────

model Gym {
  id        String   @id @default(uuid())
  name      String
  createdAt DateTime @default(now())

  userRoles   UserRole[]
  memberships Membership[]
}

// ─────────────────────────────────────────
// DYNAMIC ROLES
// ─────────────────────────────────────────

model Role {
  id          String   @id @default(uuid())
  name        String   @unique
  description String?
  isActive    Boolean  @default(true)
  isSystem    Boolean  @default(false)
  createdAt   DateTime @default(now())

  userRoles UserRole[]
}

model UserRole {
  id         String   @id @default(uuid())
  userId     String
  user       User     @relation(fields: [userId], references: [id], onDelete: Cascade)
  roleId     String
  role       Role     @relation(fields: [roleId], references: [id])
  gymId      String?
  gym        Gym?     @relation(fields: [gymId], references: [id])
  assignedAt DateTime @default(now())
  assignedBy String?

  @@unique([userId, roleId, gymId])
}

// ─────────────────────────────────────────
// MEMBERSHIPS & BILLING
// ─────────────────────────────────────────

model Membership {
  id         String           @id @default(uuid())
  profileId  String
  profile    Profile          @relation(fields: [profileId], references: [id])
  gymId      String
  gym        Gym              @relation(fields: [gymId], references: [id])
  planType   PlanType
  status     MembershipStatus
  autoDebit  Boolean          @default(false)
  expiryDate DateTime?
  createdAt  DateTime         @default(now())
}
