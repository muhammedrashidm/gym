<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINETIC Member Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Manrope:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colors from Context */
            --bg-color: #131313;
            --surface-color: #1A1A1A;
            --surface-light: #262626;
            --text-primary: #FFFFFF;
            --text-secondary: #A3A3A3;
            --text-tertiary: #737373;
            --accent-line: #444748; /* outline-variant */
            
            /* Typography from Context */
            --font-display: 'Manrope', sans-serif;
            --font-body: 'Inter', sans-serif;
            
            /* Spacing from Context */
            --space-unit: 4px;
            --container-padding: 24px;
            --stack-sm: 12px;
            --stack-md: 40px;
            --stack-lg: 64px;
            --section-gap: 80px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0; /* STRICT NO RADIUS */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            /* Optional: Subtle texture as per "Background Texture" guideline */
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Fixed Grid Container (Max-width 448px) */
        .app-container {
            width: 100%;
            max-width: 448px;
            padding: 0 var(--container-padding);
            padding-top: var(--section-gap); /* Large void at top */
            position: relative;
        }

        /* Decorative Structural Lines */
        .corner-accent {
            position: fixed;
            width: 24px;
            height: 1px;
            background-color: var(--accent-line);
        }
        .corner-tl { top: 24px; left: 24px; }
        .corner-tr { top: 24px; right: 24px; }
        .corner-bl { bottom: 24px; left: 24px; }
        .corner-br { bottom: 24px; right: 24px; }

        /* Section: Status Header */
        .section-header {
            margin-bottom: var(--section-gap);
        }

        .brand-tag {
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: var(--stack-sm);
            display: block;
        }

        .member-name {
            font-family: var(--font-display);
            font-size: 48px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: var(--stack-sm);
        }

        .member-role {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Component: Chip (Sharp, Tonal) */
        .chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            background-color: var(--surface-light);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid var(--accent-line);
        }

        /* Section: Performance Stats */
        .section-stats {
            margin-bottom: var(--section-gap);
        }

        .section-label {
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--text-tertiary);
            text-transform: uppercase;
            margin-bottom: var(--stack-md);
            border-left: 2px solid var(--text-primary);
            padding-left: 12px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--stack-md);
        }

        .stat-card {
            background-color: var(--surface-color);
            padding: var(--container-padding);
            border: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .stat-card:hover {
            border-color: var(--accent-line);
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-label {
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        /* Section: Active Session (Monolithic Button Style) */
        .section-action {
            margin-bottom: var(--section-gap);
        }

        .active-card {
            background-color: var(--text-primary);
            color: var(--bg-color);
            padding: var(--container-padding);
            position: relative;
        }

        .active-label {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            opacity: 0.6;
        }

        .active-value {
            font-family: var(--font-display);
            font-size: 48px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: var(--stack-md);
        }

        /* Component: Monolithic Button */
        .btn-massive {
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 24px 0;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-massive:hover {
            background-color: #E53935; /* Accent Red as per context hover */
            transform: translateY(-2px);
        }

        /* Section: Technical Inputs (Profile Edit) */
        .section-edit {
            margin-bottom: var(--section-gap);
        }

        .form-group {
            margin-bottom: var(--stack-md);
        }

        .input-wrapper {
            background-color: var(--surface-color);
            border: 1px solid transparent;
            padding: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--text-primary);
        }

        .input-label {
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .input-display {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Footer */
        .footer-line {
            width: 100%;
            height: 1px;
            background-color: var(--accent-line);
            margin-bottom: var(--section-gap);
        }

        .logout-link {
            display: block;
            text-align: center;
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            text-decoration: none;
            padding: 24px 0;
        }

        .logout-link:hover {
            color: var(--text-primary);
        }

    </style>
</head>
<body>

    <!-- Decorative Corner Accents -->
    <div class="corner-accent corner-tl"></div>
    <div class="corner-accent corner-tr"></div>
    <div class="corner-accent corner-bl"></div>
    <div class="corner-accent corner-br"></div>

    <div class="app-container">
        
        <!-- Header Section -->
        <div class="section-header">
            <span class="brand-tag">Member ID: 892-AX</span>
            <h1 class="member-name">ALEXANDER<br>VOSS</h1>
            <div class="member-role">
                <span>Elite Athlete</span>
                <span class="chip">Verified</span>
            </div>
        </div>

        <!-- Performance Stats -->
        <div class="section-stats">
            <div class="section-label">Performance Metrics</div>
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-value">842</div>
                    <div class="stat-label">Calories Burned</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">1:42</div>
                    <div class="stat-label">Avg Pace /km</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">98%</div>
                    <div class="stat-label">Recovery Rate</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">12</div>
                    <div class="stat-label">Sessions / Week</div>
                </div>
            </div>
        </div>

        <!-- Active Session / Monolithic Button -->
        <div class="section-action">
            <div class="active-card">
                <div class="active-label">Next Session</div>
                <div class="active-value">HIIT<br>CORE</div>
                <div style="font-family: var(--font-body); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.8;">
                    18:00 PM • ZONE A
                </div>
            </div>
            <button class="btn-massive" style="margin-top: var(--stack-md);">
                Check In Now
            </button>
        </div>

        <!-- Profile Details (Technical Inputs) -->
        <div class="section-edit">
            <div class="section-label">Profile Configuration</div>
            
            <div class="form-group">
                <div class="input-wrapper">
                    <span class="input-label">Email</span>
                    <span class="input-display">a.voss@kinetic.com</span>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <span class="input-label">Goal</span>
                    <span class="input-display">Powerlifting</span>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <span class="input-label">Status</span>
                    <span class="input-display" style="color: var(--text-primary);">Active</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-line"></div>
        <a href="#" class="logout-link">Disconnect Session</a>

    </div>

</body>
</html>
